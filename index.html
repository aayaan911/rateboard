<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RateBoard</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Multi-currency converter. Convert to many currencies at once with a built-in calculator.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffb020' font-family='sans-serif' font-weight='700'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffb020' font-family='sans-serif' font-weight='700'%3E%24%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0a; --row:#2b2b2b; --row2:#232323; --chip:#252525; --chip-b:#3a3a3a;
  --active:#3d3320; --active-b:#ffb020; --txt:#f2f2f2; --mut:#8a8a8a;
  --key:#2e2e2e; --key-l:#b8b8b8; --acc:#ffa000; --ok:#3ddc84;
  --rowh:clamp(50px,7.6vh,66px); --keyh:clamp(44px,7.2vh,64px); --gap:clamp(6px,1.2vh,11px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;gap:10px}
.brand h1{font-size:20px;font-weight:600;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:var(--ok);margin-top:2px}
.brand small.stale{color:#e0a000}
.brand small.err{color:#ff5f5f}
.tools{display:flex;gap:14px;align-items:center}
.tools button{background:none;border:0;color:var(--acc);line-height:0;cursor:pointer;padding:4px}
.tools button svg{width:24px;height:24px;display:block}
.tools button:active{opacity:.5}
.spin{animation:sp .8s linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}

.rows{flex:1;overflow-y:auto;padding:2px 12px 8px;display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.row{display:flex;gap:10px;align-items:stretch}
.cur{
  flex:0 0 clamp(96px,26vw,128px);background:var(--chip);border:1px solid var(--chip-b);border-radius:16px;
  display:flex;align-items:center;gap:9px;padding:0 12px;cursor:pointer;
}
.cur .fl{width:28px;height:28px;border-radius:50%;flex:0 0 28px;object-fit:cover;background:#3a3a3a;display:block}
.cur .fle{font-size:22px;line-height:28px;width:28px;text-align:center;flex:0 0 28px}
.cur .cd{font-size:clamp(15px,4.3vw,18px);font-weight:600;letter-spacing:.3px}
.amt{
  flex:1;background:var(--row);border:1px solid transparent;border-radius:16px;
  padding:10px 16px;min-height:var(--rowh);display:flex;flex-direction:column;
  align-items:flex-end;justify-content:center;cursor:pointer;overflow:hidden;
}
.amt .v{font-size:clamp(20px,5.6vw,26px);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.amt .r{font-size:10.5px;color:var(--mut);margin-top:2px;white-space:nowrap;opacity:.85}
.row.on .amt{background:var(--active);border-color:var(--active-b)}
.row.on .amt .v{color:#ffd58a}
.row .del{flex:0 0 34px;display:none;align-items:center;justify-content:center;background:#3a2020;border:1px solid #5a2c2c;border-radius:12px;color:#ff7b7b;font-size:18px;cursor:pointer}
body.edit .row .del{display:flex}
.addbtn{
  margin:2px 0 4px;padding:12px;border-radius:14px;border:1px dashed #4a4a4a;background:none;
  color:var(--acc);font-size:15px;cursor:pointer;display:none;width:100%
}
body.edit .addbtn{display:block}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.pad button{
  border:0;border-radius:20px;background:var(--key);color:var(--txt);
  font-size:clamp(19px,5.4vw,24px);font-weight:500;height:var(--keyh);cursor:pointer;transition:filter .08s
}
.pad button:active{filter:brightness(1.5)}
.pad .lt{background:var(--key-l);color:#111;font-weight:600}
.pad .op{background:var(--acc);color:#fff;font-weight:600}
.pad .z{grid-column:span 2}

.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:50
}
.sheet.on{display:flex}
.panel{
  background:#151515;width:100%;max-width:520px;max-height:82vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden
}
.panel h2{font-size:16px;padding:16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{color:var(--acc);cursor:pointer;font-size:22px;line-height:1}
.search{margin:12px 16px;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:var(--txt);font-size:16px;outline:none}
.list{overflow-y:auto;padding:0 8px 20px}
.item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;cursor:pointer}
.item:active{background:#242424}
.item .fl{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;background:#3a3a3a}
.item .fle{font-size:21px;width:26px;flex:0 0 26px;text-align:center}
.item .cd{font-weight:600;width:52px}
.item .nm{color:var(--mut);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{color:#666;font-size:12px}
.item.sel{background:#232323}
.note{padding:0 18px 18px;color:var(--mut);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>RateBoard</h1>
      <small id="status">Loading rates...</small>
    </div>
    <div class="tools">
      <button id="btnRefresh" title="Refresh rates" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="btnRates" title="Rate table" aria-label="Rate table">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M4 21h16"/><path d="M6 21V10.5M10 21V10.5M14 21V10.5M18 21V10.5"/></svg>
      </button>
      <button id="btnEdit" title="Edit currencies" aria-label="Edit currencies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 16.11 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.43 9v.09A1.65 1.65 0 0 0 21.91 10.6H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="rows" id="rows"></div>
  <button class="addbtn" id="btnAdd" style="width:calc(100% - 24px);margin-left:12px">+ Add currency</button>

  <div class="pad">
    <button class="lt" data-k="C">C</button>
    <button class="lt" data-k="back">&#8592;</button>
    <button class="lt" data-k="%">%</button>
    <button class="op" data-k="/">&divide;</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op" data-k="*">&times;</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op" data-k="-">&minus;</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op" data-k="+">+</button>
    <button class="z" data-k="0">0</button><button data-k=".">.</button>
    <button class="op" data-k="=">=</button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle">Select currency <span id="sheetClose">&times;</span></h2>
    <input class="search" id="search" placeholder="Search code or name" autocomplete="off">
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sheet" id="ratesSheet">
  <div class="panel">
    <h2>Rate table <span id="ratesClose">&times;</span></h2>
    <div class="list" id="rateList"></div>
    <div class="note" id="rateNote"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var API = "https://open.er-api.com/v6/latest/USD";
var DEFAULTS = ["USD","AED","IDR","BDT","PKR"];

var NAMES = {USD:"US Dollar",EUR:"Euro",GBP:"British Pound",AED:"UAE Dirham",SAR:"Saudi Riyal",QAR:"Qatari Riyal",KWD:"Kuwaiti Dinar",BHD:"Bahraini Dinar",OMR:"Omani Rial",JOD:"Jordanian Dinar",BDT:"Bangladeshi Taka",PKR:"Pakistani Rupee",INR:"Indian Rupee",LKR:"Sri Lankan Rupee",NPR:"Nepalese Rupee",BTN:"Bhutanese Ngultrum",MVR:"Maldivian Rufiyaa",AFN:"Afghan Afghani",IDR:"Indonesian Rupiah",MYR:"Malaysian Ringgit",SGD:"Singapore Dollar",THB:"Thai Baht",PHP:"Philippine Peso",VND:"Vietnamese Dong",KHR:"Cambodian Riel",LAK:"Lao Kip",MMK:"Myanmar Kyat",BND:"Brunei Dollar",CNY:"Chinese Yuan",JPY:"Japanese Yen",KRW:"South Korean Won",HKD:"Hong Kong Dollar",TWD:"Taiwan Dollar",MNT:"Mongolian Tugrik",AUD:"Australian Dollar",NZD:"New Zealand Dollar",FJD:"Fijian Dollar",PGK:"Papua New Guinean Kina",CAD:"Canadian Dollar",MXN:"Mexican Peso",BRL:"Brazilian Real",ARS:"Argentine Peso",CLP:"Chilean Peso",COP:"Colombian Peso",PEN:"Peruvian Sol",CHF:"Swiss Franc",SEK:"Swedish Krona",NOK:"Norwegian Krone",DKK:"Danish Krone",ISK:"Icelandic Krona",PLN:"Polish Zloty",CZK:"Czech Koruna",HUF:"Hungarian Forint",RON:"Romanian Leu",BGN:"Bulgarian Lev",RSD:"Serbian Dinar",UAH:"Ukrainian Hryvnia",RUB:"Russian Ruble",TRY:"Turkish Lira",ILS:"Israeli Shekel",EGP:"Egyptian Pound",MAD:"Moroccan Dirham",DZD:"Algerian Dinar",TND:"Tunisian Dinar",LYD:"Libyan Dinar",IQD:"Iraqi Dinar",IRR:"Iranian Rial",LBP:"Lebanese Pound",SYP:"Syrian Pound",YER:"Yemeni Rial",ZAR:"South African Rand",NGN:"Nigerian Naira",GHS:"Ghanaian Cedi",KES:"Kenyan Shilling",TZS:"Tanzanian Shilling",UGX:"Ugandan Shilling",ETB:"Ethiopian Birr",ZMW:"Zambian Kwacha",MUR:"Mauritian Rupee",BWP:"Botswana Pula",NAD:"Namibian Dollar",MZN:"Mozambican Metical",AOA:"Angolan Kwanza",SDG:"Sudanese Pound",SOS:"Somali Shilling",KZT:"Kazakhstani Tenge",UZS:"Uzbekistani Som",AZN:"Azerbaijani Manat",GEL:"Georgian Lari",AMD:"Armenian Dram",KGS:"Kyrgystani Som",TJS:"Tajikistani Somoni",TMT:"Turkmenistani Manat",BYN:"Belarusian Ruble",MDL:"Moldovan Leu",ALL:"Albanian Lek",MKD:"Macedonian Denar",BAM:"Bosnia Mark",JMD:"Jamaican Dollar",TTD:"Trinidad Dollar",DOP:"Dominican Peso",CUP:"Cuban Peso",GTQ:"Guatemalan Quetzal",HNL:"Honduran Lempira",CRC:"Costa Rican Colon",PAB:"Panamanian Balboa",UYU:"Uruguayan Peso",PYG:"Paraguayan Guarani",BOB:"Bolivian Boliviano",VES:"Venezuelan Bolivar"};

var FLAGX = {EUR:"EU",XAF:null,XOF:null,XCD:null,XDR:null,XPF:null,ANG:null,CHF:"CH",GBP:"GB",DKK:"DK",NOK:"NO",SEK:"SE",CZK:"CZ",EGP:"EG"};

function cc2(code){ return FLAGX.hasOwnProperty(code) ? FLAGX[code] : code.slice(0,2); }
function emojiFlag(code){
  var cc = cc2(code);
  if(!cc) return "💱";
  return String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(0)-65)) + String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(1)-65));
}
/* circular flag: raster flag cropped to a circle, emoji fallback if the CDN is unreachable */
function flag(code){
  var cc = cc2(code);
  if(!cc) return '<span class="fle">' + emojiFlag(code) + '</span>';
  return '<img class="fl" alt="" loading="lazy" src="https://flagcdn.com/w80/' + cc.toLowerCase() +
         '.png" onerror="this.outerHTML=&quot;<span class=\'fle\'>' + emojiFlag(code) + '</span>&quot;">';
}
function nameOf(c){ return NAMES[c] || c; }

/* ---------- storage (safe) ---------- */
function ls(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; }
}

/* ---------- state ---------- */
var rates = {}, updated = "", list, active = 0, expr = "";
try{ list = JSON.parse(ls("rb_list")||"null"); }catch(e){ list = null; }
if(!Array.isArray(list) || !list.length) list = DEFAULTS.slice();
try{
  var cached = JSON.parse(ls("rb_rates")||"null");
  if(cached && cached.rates){ rates = cached.rates; updated = cached.updated; }
}catch(e){}

/* ---------- expression engine ---------- */
function evalExpr(s){
  if(!s) return 0;
  s = s.replace(/[+\-*/.]+$/,"");
  if(!s) return 0;
  var t = s.match(/(\d+\.?\d*|[+\-*/])/g);
  if(!t || !t.length) return 0;
  var a = [], i;
  for(i=0;i<t.length;i++){
    if(t[i]==="*"||t[i]==="/"){
      var l = parseFloat(a.pop()), r = parseFloat(t[++i]);
      if(isNaN(r)) r = 0;
      a.push(t[i-1]==="*" ? l*r : (r===0?0:l/r));
    } else a.push(t[i]);
  }
  var out = parseFloat(a[0])||0;
  for(i=1;i<a.length;i+=2){
    var n = parseFloat(a[i+1])||0;
    out = a[i]==="+" ? out+n : out-n;
  }
  return isFinite(out) ? out : 0;
}

function convert(v, from, to){
  if(!rates[from] || !rates[to]) return null;
  return v / rates[from] * rates[to];
}
function fmt(v){
  if(v===null || !isFinite(v)) return "-";
  if(v===0) return "0";
  var a = Math.abs(v);
  var d = a >= 1 ? 2 : (a >= 0.01 ? 4 : 6);
  return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:d});
}

/* ---------- render ---------- */
var rowsEl = document.getElementById("rows");
function render(){
  var base = list[active], val = evalExpr(expr);
  rowsEl.innerHTML = "";
  list.forEach(function(code,i){
    var on = i===active;
    var row = document.createElement("div");
    row.className = "row" + (on?" on":"");
    var shown = on ? (expr || "0") : fmt(convert(val, base, code));
    row.innerHTML =
      '<div class="cur" data-pick="'+i+'">'+flag(code)+'<span class="cd">'+code+'</span></div>'+
      '<div class="amt" data-sel="'+i+'"><div class="v">'+shown+'</div></div>'+
      '<div class="del" data-del="'+i+'">&times;</div>';
    rowsEl.appendChild(row);
  });
}

rowsEl.addEventListener("click", function(e){
  var t = e.target.closest("[data-sel],[data-pick],[data-del]");
  if(!t) return;
  if(t.hasAttribute("data-del")){
    if(list.length<=2) return;
    var d = +t.getAttribute("data-del");
    list.splice(d,1);
    if(active>=list.length) active = list.length-1;
    save(); render(); return;
  }
  if(t.hasAttribute("data-pick")){ openPicker(+t.getAttribute("data-pick")); return; }
  var i = +t.getAttribute("data-sel");
  if(i!==active){
    var v = evalExpr(expr);
    var nv = convert(v, list[active], list[i]);
    active = i;
    expr = (nv===null||nv===0) ? "" : String(Math.round(nv*10000)/10000);
    render();
  }
});

/* ---------- keypad ---------- */
document.querySelector(".pad").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return; press(b.getAttribute("data-k"));
});
function press(k){
  if(k==="C"){ expr=""; }
  else if(k==="back"){ expr = expr.slice(0,-1); }
  else if(k==="="){ expr = String(evalExpr(expr)); }
  else if(k==="%"){
    var m = expr.match(/(\d+\.?\d*)$/);
    if(m){ expr = expr.slice(0,m.index) + String(parseFloat(m[1])/100); }
  }
  else if("+-*/".indexOf(k)>=0){
    if(!expr) { if(k==="-") expr="-"; }
    else if("+-*/".indexOf(expr.slice(-1))>=0) expr = expr.slice(0,-1)+k;
    else expr += k;
  }
  else if(k==="."){
    var last = expr.split(/[+\-*/]/).pop();
    if(last.indexOf(".")<0) expr += (last===""?"0.":".");
  }
  else { if(expr==="0") expr=k; else expr += k; }
  render();
}
document.addEventListener("keydown", function(e){
  if(document.getElementById("search")===document.activeElement) return;
  var k = e.key;
  if(/^[0-9.]$/.test(k)) press(k);
  else if("+-*/".indexOf(k)>=0 && k.length===1) press(k);
  else if(k==="Enter"||k==="=") press("=");
  else if(k==="Backspace") press("back");
  else if(k==="Escape") press("C");
  else if(k==="%") press("%");
});

/* ---------- picker ---------- */
var sheet = document.getElementById("sheet"), listEl = document.getElementById("list"),
    searchEl = document.getElementById("search"), sheetTitle = document.getElementById("sheetTitle");
var pickTarget = null;

function openPicker(i){
  pickTarget = i;
  sheetTitle.childNodes[0].nodeValue = (i===null ? "Add currency " : "Change currency ");
  searchEl.value = ""; sheet.classList.add("on"); drawList("");
  setTimeout(function(){ searchEl.focus(); }, 80);
}
function closePicker(){ sheet.classList.remove("on"); }
document.getElementById("sheetClose").onclick = closePicker;
sheet.addEventListener("click", function(e){ if(e.target===sheet) closePicker(); });
searchEl.addEventListener("input", function(){ drawList(searchEl.value.trim().toLowerCase()); });

function drawList(q){
  var codes = Object.keys(rates).sort();
  var html = "";
  codes.forEach(function(c){
    var n = nameOf(c);
    if(q && c.toLowerCase().indexOf(q)<0 && n.toLowerCase().indexOf(q)<0) return;
    var used = list.indexOf(c)>=0;
    html += '<div class="item'+(used?" sel":"")+'" data-c="'+c+'">'+flag(c)+
            '<span class="cd">'+c+'</span><span class="nm">'+n+'</span>'+
            '<span class="rt">'+fmt(rates[c])+'</span></div>';
  });
  listEl.innerHTML = html || '<div class="note">No match.</div>';
}
listEl.addEventListener("click", function(e){
  var it = e.target.closest("[data-c]"); if(!it) return;
  var c = it.getAttribute("data-c");
  if(pickTarget===null){ if(list.indexOf(c)<0) list.push(c); }
  else {
    var ex = list.indexOf(c);
    if(ex>=0 && ex!==pickTarget) return;
    list[pickTarget] = c;
  }
  save(); closePicker(); render();
});

document.getElementById("btnAdd").onclick = function(){ openPicker(null); };
document.getElementById("btnEdit").onclick = function(){ document.body.classList.toggle("edit"); };

/* ---------- rate table ---------- */
var rSheet = document.getElementById("ratesSheet");
document.getElementById("ratesClose").onclick = function(){ rSheet.classList.remove("on"); };
rSheet.addEventListener("click", function(e){ if(e.target===rSheet) rSheet.classList.remove("on"); });
document.getElementById("btnRates").onclick = function(){
  var base = list[active], h = "";
  list.forEach(function(c){
    if(c===base) return;
    h += '<div class="item">'+flag(c)+'<span class="cd">'+c+'</span>'+
         '<span class="nm">1 '+base+' = '+fmt(rates[c]/rates[base])+' '+c+'</span></div>';
    h += '<div class="item">'+flag(base)+'<span class="cd">'+base+'</span>'+
         '<span class="nm">1 '+c+' = '+fmt(rates[base]/rates[c])+' '+base+'</span></div>';
  });
  document.getElementById("rateList").innerHTML = h;
  document.getElementById("rateNote").textContent = "Source: exchangerate-api.com open endpoint. Mid-market rates, refreshed once every 24h. Last update: " + (updated || "unknown") + ". Banks and remittance services apply their own spread, typically 1% to 3%.";
  rSheet.classList.add("on");
};

/* ---------- fetch ---------- */
var statusEl = document.getElementById("status"), refBtn = document.getElementById("btnRefresh");
function save(){
  ls("rb_list", JSON.stringify(list));
  ls("rb_rates", JSON.stringify({rates:rates,updated:updated}));
}
function setStatus(txt, cls){ statusEl.textContent = txt; statusEl.className = cls||""; }
var fetchedAt = parseInt(ls("rb_at")||"0",10) || 0, offline = false;
function ago(){
  if(offline) return "Offline, saved rates";
  if(!fetchedAt) return "Saved rates";
  var s = Math.floor((Date.now()-fetchedAt)/1000);
  if(s<60) return "Just now";
  if(s<3600) return Math.floor(s/60) + " min ago";
  if(s<86400) return Math.floor(s/3600) + " h ago";
  return Math.floor(s/86400) + " d ago";
}
function tick(){ setStatus(ago(), offline ? "stale" : ""); }
setInterval(tick, 20000);

function load(force){
  refBtn.firstElementChild.classList.add("spin");
  fetch(API, {cache: force ? "reload" : "default"})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(d.result!=="success") throw new Error("bad");
      rates = d.rates; updated = d.time_last_update_utc;
      fetchedAt = Date.now(); offline = false;
      ls("rb_at", String(fetchedAt));
      save(); render(); tick();
    })
    .catch(function(){
      offline = true;
      if(Object.keys(rates).length) tick();
      else setStatus("No rates yet. Go online once.", "err");
    })
    .then(function(){ refBtn.firstElementChild.classList.remove("spin"); });
}
refBtn.onclick = function(){ load(true); };

if(Object.keys(rates).length){ tick(); }
render();
load(false);

ml.rel = "manifest";
ml.href = "data:application/manifest+json," + encodeURIComponent(JSON.stringify(mf));
document.head.appendChild(ml);

if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
