<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RateBoard</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Multi-currency converter. Convert to many currencies at once with a built-in calculator.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffb020' font-family='sans-serif' font-weight='700'%3E%24%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230a0a0a'/%3E%3Ctext x='32' y='44' font-size='36' text-anchor='middle' fill='%23ffb020' font-family='sans-serif' font-weight='700'%3E%24%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0a; --row:#2b2b2b; --row2:#232323; --chip:#252525; --chip-b:#3a3a3a;
  --active:#3d3320; --active-b:#ffb020; --txt:#f2f2f2; --mut:#8a8a8a;
  --key:#2e2e2e; --key-l:#b8b8b8; --acc:#ffa000; --ok:#3ddc84;
  --rowh:clamp(50px,7.6vh,66px); --keyh:clamp(44px,7.2vh,64px); --gap:clamp(6px,1.2vh,11px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%}

header{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px;gap:8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto;overflow:hidden}
.brand .txt{min-width:0;overflow:hidden}
.mark{width:34px;height:34px;flex:0 0 34px;filter:drop-shadow(0 3px 8px rgba(255,160,0,.28))}
.mark svg{width:100%;height:100%;display:block}
.brand h1{
  font-size:clamp(17px,4.7vw,21px);font-weight:700;letter-spacing:-.4px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.brand h1 span{color:#fff}
.brand h1 b{color:var(--acc);font-weight:700}
.brand small{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:#c9a24c;
  margin-top:2px;letter-spacing:.1px;font-weight:500
}
.brand small::before{
  content:"";width:5px;height:5px;border-radius:50%;background:currentColor;
  flex:0 0 5px;box-shadow:0 0 6px currentColor;opacity:.9
}
.brand small.stale{color:#8d8d8d}
.brand small.stale::before{box-shadow:none;opacity:.6}
.brand small.err{color:#e06a6a}
.right{display:flex;align-items:center}
.brand h1 sub{
  bottom:0;font-size:8px;font-weight:600;color:#6a6a6a;letter-spacing:.4px;
  text-transform:uppercase;margin-left:6px;white-space:nowrap;vertical-align:baseline
}
.tools{display:flex;gap:11px;align-items:center;flex:0 0 auto}
.tools button{background:none;border:0;color:var(--acc);line-height:0;cursor:pointer;padding:3px}
.tools button svg{width:22px;height:22px;display:block}
.tools button:active{opacity:.5}
.spin{animation:sp .8s linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}

.rows{flex:1;overflow-y:auto;padding:2px 12px 8px;display:flex;flex-direction:column;gap:var(--gap);min-height:0}
.row{display:flex;gap:10px;align-items:stretch}
.cur{
  flex:0 0 clamp(96px,26vw,128px);background:var(--chip);border:1px solid var(--chip-b);border-radius:16px;
  display:flex;align-items:center;gap:9px;padding:0 12px;cursor:pointer;
}
.cur .fl{width:28px;height:28px;border-radius:50%;flex:0 0 28px;object-fit:cover;background:#3a3a3a;display:block}
.cur .fle{font-size:22px;line-height:28px;width:28px;text-align:center;flex:0 0 28px}
.cur .cd{font-size:clamp(15px,4.3vw,18px);font-weight:600;letter-spacing:.3px}
.amt{
  flex:1;background:var(--row);border:1px solid transparent;border-radius:16px;
  padding:10px 14px;min-height:var(--rowh);display:flex;flex-direction:row;
  align-items:center;justify-content:space-between;gap:8px;cursor:pointer;overflow:hidden;
}
.amt .sym{
  font-size:clamp(13px,3.6vw,15px);font-weight:600;color:#8f8f8f;flex:0 0 auto;
  min-width:22px;text-align:left;line-height:1
}
.amt .v{
  font-size:clamp(20px,5.6vw,26px);font-weight:400;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:right;flex:1;font-variant-numeric:tabular-nums;
  transition:font-size .12s ease,color .2s ease
}
.amt .v.l1{font-size:clamp(18px,4.9vw,23px)}
.amt .v.l2{font-size:clamp(16px,4.3vw,20px)}
.amt .v.l3{font-size:clamp(14px,3.7vw,17px)}
.row.on .amt{background:var(--active);border-color:var(--active-b)}
.row.on .amt .v{color:#ffd58a}
.row.on .amt .sym{color:#e0a94e}
.row .del{flex:0 0 34px;display:none;align-items:center;justify-content:center;background:#3a2020;border:1px solid #5a2c2c;border-radius:12px;color:#ff7b7b;font-size:18px;cursor:pointer}
body.edit .row .del{display:flex}
.addbtn{
  margin:2px 0 4px;padding:12px;border-radius:14px;border:1px dashed #4a4a4a;background:none;
  color:var(--acc);font-size:15px;cursor:pointer;display:none;width:100%
}
body.edit .addbtn{display:block}

.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--gap);padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
.pad button{
  border:0;border-radius:20px;background:var(--key);color:var(--txt);
  font-size:clamp(20px,5.6vw,25px);font-weight:500;height:var(--keyh);cursor:pointer;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center
}
.pad button:active{filter:brightness(1.5)}
.pad .lt{background:var(--key-l);color:#111;font-weight:600}
.pad .op{background:var(--acc);color:#fff;font-weight:600}
.pad .z{grid-column:span 2}
.pad .ic svg{
  width:clamp(23px,6.4vw,29px);height:clamp(23px,6.4vw,29px);display:block;
  fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round
}
.pad .lt.ic svg{stroke-width:2.1}

.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:50
}
.sheet.on{display:flex}
.panel{
  background:#151515;width:100%;max-width:520px;max-height:82vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden
}
.panel h2{font-size:16px;padding:16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{color:var(--acc);cursor:pointer;font-size:22px;line-height:1}
.search{margin:12px 16px;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:var(--txt);font-size:16px;outline:none}
.list{overflow-y:auto;padding:0 8px 20px}
.item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;cursor:pointer}
.item:active{background:#242424}
.item .fl{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;background:#3a3a3a}
.item .fle{font-size:21px;width:26px;flex:0 0 26px;text-align:center}
.item .cd{font-weight:600;width:52px}
.item .nm{color:var(--mut);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{color:#666;font-size:12px}
.item.sel{background:#232323}
.note{padding:0 18px 18px;color:var(--mut);font-size:12px;line-height:1.6}

/* ---------- motion ---------- */
.row{animation:rise .34s cubic-bezier(.2,.8,.25,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.amt{transition:background .22s ease,border-color .22s ease,transform .12s ease}
.amt:active{transform:scale(.985)}
.cur{transition:transform .12s ease,background .2s ease}
.cur:active{transform:scale(.96)}
.row.on .amt{box-shadow:0 0 0 3px rgba(255,176,32,.10)}
.row.on .cur{background:#2f2a1e;border-color:#5a4a24}

.amt .v{transition:color .2s ease}
.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1)}
@keyframes bump{0%{opacity:.35;transform:translateY(-5px)}60%{opacity:1;transform:translateY(1px)}100%{transform:none}}

.pad button{transition:transform .09s cubic-bezier(.3,1.4,.5,1),filter .09s ease}
.pad button:active{transform:scale(.9)}

.sheet{animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet.on .panel{animation:slide .3s cubic-bezier(.2,.85,.25,1) both}
@keyframes slide{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#efefef;color:#111;font-size:13px;font-weight:500;padding:10px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1);
  z-index:80;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.tools button svg{transition:transform .15s ease}
.tools button:active svg{transform:scale(.85)}
body.edit .row .del{animation:fade .2s ease backwards}

/* grip + drag */
/* always visible so reordering needs no mode switch */
.row .grip{
  flex:0 0 30px;display:flex;align-items:center;justify-content:center;background:transparent;
  border:0;border-radius:10px;color:#565656;cursor:grab;touch-action:none;
  transition:color .15s ease,background .15s ease
}
.row .grip svg{width:19px;height:19px;fill:currentColor;pointer-events:none}
.row .grip:active{color:var(--acc);background:#2a2417}
body.edit .row .grip{background:#242424;border:1px solid #383838;color:#9a9a9a}
body.edit .amt{display:none}
body.edit .cur{flex:1 1 auto}
body.edit .cur::after{content:attr(data-name);color:#7d7d7d;font-size:12.5px;font-weight:400;margin-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{transition:transform .16s cubic-bezier(.2,.8,.25,1)}
.row.dragging{transition:none!important;animation:none!important;z-index:9;position:relative;will-change:transform}
.row.dragging .amt,.row.dragging .cur{box-shadow:0 12px 28px rgba(0,0,0,.6);border-color:var(--acc)}
.row.dragging .grip{color:var(--acc);background:#2f2a1e;cursor:grabbing}
.row.shifting{transition:transform .16s cubic-bezier(.2,.8,.25,1)}
.row.slot .amt{background:#242424}
body.dragging .rows{overflow:hidden}
body.dragging{user-select:none}

/* sheet extras */
.grp{padding:12px 12px 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#6f6f6f}
.item .nm i{color:#5f5f5f;font-style:normal}
.toast.tap{pointer-events:auto;cursor:pointer}
.toast .undo{color:#b06a00;margin-left:8px;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
.hitem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer}
.hitem:active{background:#242424}
.hitem .ha{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.hitem .hc{color:var(--acc);font-size:13px;font-weight:600}
.hitem .ht{margin-left:auto;color:#666;font-size:11.5px;text-align:right;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:#6f6f6f;font-size:13px;line-height:1.7}
.ritem{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px}
.ritem .fl{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;background:#3a3a3a}
.ritem .fle{font-size:21px;width:26px;flex:0 0 26px;text-align:center}
.ritem .rc{font-weight:700;width:50px;flex:0 0 50px;font-size:14px;letter-spacing:.3px}
.ritem .rr{flex:1;min-width:0}
.ritem .r1{font-size:14px;color:#e8e8e8;font-variant-numeric:tabular-nums}
.ritem .r1 b{font-weight:700;color:#fff}
.ritem .r2{font-size:11.5px;color:#7a7a7a;margin-top:2px;font-variant-numeric:tabular-nums}
.ritem.base{background:#221d12;border:1px solid #4a3c1c}
.ritem.base .rc{color:var(--acc)}
.ritem.base .r1{font-size:13px;color:#d9c79c}
.ritem.base .r2{color:#8a7a55}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 40 40">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffc44d"/><stop offset="1" stop-color="#f08a00"/>
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="40" height="40" rx="11" fill="url(#lg)"/>
          <g fill="none" stroke="#191100" stroke-width="2.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 15.5h16l-4-4"/>
            <path d="M29 24.5H13l4 4"/>
          </g>
        </svg>
      </div>
      <div class="txt">
        <h1><span>Rate</span><b>Board</b><sub>by Ayaan Shohan</sub></h1>
        <small id="status">Loading rates...</small>
      </div>
    </div>
    <div class="right">
    <div class="tools">
      <button id="btnRefresh" title="Refresh rates" aria-label="Refresh rates">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
      <button id="btnRates" title="Rate table" aria-label="Rate table">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.6"/><path d="M3 9.4h18M10.2 9.4V19.5"/><path d="M13.3 13.2h4.4M13.3 16.3h3"/><path d="M5.9 13.2h1.6M5.9 16.3h1.6"/></svg>
      </button>
      <button id="btnHist" title="History" aria-label="History">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12.4" r="7.6"/><path d="M12 8.6v4.1l2.8 1.7"/><path d="M4.6 6.2 6.9 4"/></svg>
      </button>
      <button id="btnEdit" title="Edit currencies" aria-label="Edit currencies">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10.6 3.09V3a2 2 0 1 1 4 0v.09A1.65 1.65 0 0 0 16.11 4.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 20.43 9v.09A1.65 1.65 0 0 0 21.91 10.6H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
    </div>
  </header>

  <div class="rows" id="rows"></div>
  <div class="toast" id="toast"></div>
  <button class="addbtn" id="btnAdd" style="width:calc(100% - 24px);margin-left:12px">+ Add currency</button>

  <div class="pad">
    <button class="lt" data-k="C" aria-label="Clear">C</button>
    <button class="lt ic" data-k="back" aria-label="Backspace">
      <svg viewBox="0 0 24 24"><path d="M19.6 5.6H9.9a1.7 1.7 0 0 0-1.24.54L3.75 11.4a.85.85 0 0 0 0 1.2l4.91 5.26a1.7 1.7 0 0 0 1.24.54h9.7A1.7 1.7 0 0 0 21.3 16.7V7.3a1.7 1.7 0 0 0-1.7-1.7Z"/><path d="M12.9 10.1l4.3 3.8M17.2 10.1l-4.3 3.8" stroke-width="1.9"/></svg>
    </button>
    <button class="lt ic" data-k="%" aria-label="Percent">
      <svg viewBox="0 0 24 24"><path d="M18.5 5.5 5.5 18.5"/><circle cx="7.6" cy="7.6" r="2.6"/><circle cx="16.4" cy="16.4" r="2.6"/></svg>
    </button>
    <button class="op ic" data-k="/" aria-label="Divide">
      <svg viewBox="0 0 24 24"><path d="M5.2 12h13.6"/><circle cx="12" cy="6.6" r="1.55" fill="currentColor" stroke="none"/><circle cx="12" cy="17.4" r="1.55" fill="currentColor" stroke="none"/></svg>
    </button>

    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button class="op ic" data-k="*" aria-label="Multiply">
      <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"/></svg>
    </button>

    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button class="op ic" data-k="-" aria-label="Minus">
      <svg viewBox="0 0 24 24"><path d="M5.4 12h13.2"/></svg>
    </button>

    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button class="op ic" data-k="+" aria-label="Plus">
      <svg viewBox="0 0 24 24"><path d="M12 5.4v13.2M5.4 12h13.2"/></svg>
    </button>

    <button class="z" data-k="0">0</button>
    <button class="ic" data-k="." aria-label="Decimal point">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="15.6" r="1.85" fill="currentColor" stroke="none"/></svg>
    </button>
    <button class="op ic" data-k="=" aria-label="Equals">
      <svg viewBox="0 0 24 24"><path d="M5.6 9.6h12.8M5.6 14.4h12.8"/></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sheet">
  <div class="panel">
    <h2 id="sheetTitle">Select currency <span id="sheetClose">&times;</span></h2>
    <input class="search" id="search" placeholder="Search currency or country" autocomplete="off">
    <div class="list" id="list"></div>
  </div>
</div>

<div class="sheet" id="histSheet">
  <div class="panel">
    <h2>Recent conversions <span id="histClose">&times;</span></h2>
    <div class="list" id="histList"></div>
    <div class="note" id="histNote"></div>
  </div>
</div>

<div class="sheet" id="ratesSheet">
  <div class="panel">
    <h2>Rate table <span id="ratesClose">&times;</span></h2>
    <div class="list" id="rateList"></div>
    <div class="note" id="rateNote"></div>
  </div>
</div>

<script>
(function(){
"use strict";

var APIS = [
  "https://open.er-api.com/v6/latest/USD",
  "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json",
  "https://latest.currency-api.pages.dev/v1/currencies/usd.json"
];
var DEFAULTS = ["USD","AED","IDR","BDT","PKR","PHP"];

var symCache = {};
function symbolOf(code){
  if(symCache[code]) return symCache[code];
  var s = SYM[code] || code;
  if(!SYM[code]){
    try{
      var parts = new Intl.NumberFormat("en", {style:"currency", currency:code}).formatToParts(1);
      for(var i=0;i<parts.length;i++){
        if(parts[i].type === "currency" && parts[i].value !== code){ s = parts[i].value; break; }
      }
    }catch(e){}
  }
  symCache[code] = s;
  return s;
}

function cc2(code){ return FLAGX.hasOwnProperty(code) ? FLAGX[code] : code.slice(0,2); }
function emojiFlag(code){
  var cc = cc2(code);
  if(!cc) return "💱";
  return String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(0)-65)) + String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(1)-65));
}
/* circular flag: raster flag cropped to a circle, emoji fallback if the CDN is unreachable */
function flag(code){
  var cc = cc2(code);
  if(!cc) return '<span class="fle">' + emojiFlag(code) + '</span>';
  return '<img class="fl" alt="" loading="lazy" src="https://flagcdn.com/w80/' + cc.toLowerCase() +
         '.png" onerror="this.outerHTML=&quot;<span class=\'fle\'>' + emojiFlag(code) + '</span>&quot;">';
}
function nameOf(c){ return NAMES[c] || c; }

function pushRecent(code){
  recents = [code].concat(recents.filter(function(c){ return c !== code; })).slice(0,6);

function pushHistory(){
  var v = evalExpr(expr);
  if(!v || !isFinite(v)) return;
  var code = list[active];

  if(last && last.c === code && Math.abs(last.a - v) < 1e-9) return;
  history.unshift({a:v, c:code, t:Date.now(), d:rateDate});
  history = history.slice(0,12);
  ls("rb_hist", JSON.stringify(history));
}

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
/* "24 July". The year is appended only when it is not the current year. */
function label(day, monthIdx, year){
  var now = new Date().getFullYear();
  return day + " " + MONTHS_FULL[monthIdx] + (year && year !== now ? " " + year : "");
}
function dateLabel(d){
  if(!d || isNaN(d.getTime())) return BUNDLED_DATE;
  return label(d.getUTCDate(), d.getUTCMonth(), d.getUTCFullYear());
}

/* ---------- expression engine ---------- */
function evalExpr(s){
  if(!s) return 0;
  s = s.replace(/[+\-*/.]+$/,"");
  if(!s) return 0;
  var t = s.match(/(\d+\.?\d*|[+\-*/])/g);
  if(!t || !t.length) return 0;
  var a = [], i;
  for(i=0;i<t.length;i++){
    if(t[i]==="*"||t[i]==="/"){
      var l = parseFloat(a.pop()), r = parseFloat(t[++i]);
      if(isNaN(r)) r = 0;
      a.push(t[i-1]==="*" ? l*r : (r===0?0:l/r));
    } else a.push(t[i]);
  }
  var out = parseFloat(a[0])||0;
  for(i=1;i<a.length;i+=2){
    var n = parseFloat(a[i+1])||0;
    out = a[i]==="+" ? out+n : out-n;
  }
  return isFinite(out) ? out : 0;
}

function convert(v, from, to){
  if(!rates[from] || !rates[to]) return null;
  return v / rates[from] * rates[to];
}
/* Whole numbers by default. Decimals only appear when dropping them would
   destroy the value (small amounts and sub-unit rates). */
function fmt(v){
  if(v===null || !isFinite(v)) return "-";
  if(v===0) return "0";
  var a = Math.abs(v);
  if(a >= 10) return v.toLocaleString("en-US",{maximumFractionDigits:0});
  if(a >= 0.01) return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:6});
}

/* ---------- feedback helpers ---------- */
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }
var toastEl = document.getElementById("toast"), toastT = null, toastAct = null;
function toast(msg, actionLabel, fn){
  toastAct = fn || null;
  toastEl.innerHTML = msg + (fn ? ' <b class="undo">' + actionLabel + '</b>' : "");
  toastEl.classList.toggle("tap", !!fn);
  toastEl.classList.add("on");

  toastT = setTimeout(hideToast, fn ? 4200 : 2200);
}

/* ---------- render ---------- */
/* Rows are built once and then updated in place, so flags never re-flicker
   and each changed number can play its own micro animation. */
var rowsEl = document.getElementById("rows"), built = "", prev = [];
function buildRows(){
  rowsEl.innerHTML = list.map(function(code,i){
    return '<div class="row" data-i="'+i+'" style="animation-delay:'+(i*35)+'ms">'+
      '<div class="cur" data-pick="'+i+'" data-name="'+nameOf(code)+'">'+flag(code)+'<span class="cd">'+code+'</span></div>'+
      '<div class="amt" data-sel="'+i+'"><span class="sym">'+symbolOf(code)+'</span><div class="v"></div></div>'+
      '<div class="grip" data-grip="'+i+'" aria-label="Drag to reorder"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg></div>'+
      '<div class="del" data-del="'+i+'">&times;</div>'+
    '</div>';
  }).join("");
  built = list.join(",");
  prev = [];
}
/* group the digits of a plain typed number, leave expressions untouched */
function typed(){
  if(!expr) return "0";
  if(!/^-?\d*\.?\d*$/.test(expr)) return expr;
  var neg = expr.charAt(0) === "-", t = neg ? expr.slice(1) : expr;
  var dot = t.indexOf("."), ip = dot < 0 ? t : t.slice(0,dot), rest = dot < 0 ? "" : t.slice(dot);
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + ip + rest;
}
function render(){
  if(built !== list.join(",")) buildRows();
  saveState();
  var base = list[active], val = evalExpr(expr);
  var rows = rowsEl.children;
  for(var i=0;i<rows.length;i++){
    var on = i===active;
    rows[i].classList.toggle("on", on);
    var v = rows[i].querySelector(".v");
    var shown = on ? typed() : fmt(convert(val, base, list[i]));
    if(prev[i] !== shown){
      v.textContent = shown;
      var n = shown.length;
      v.className = "v" + (n > 20 ? " l3" : n > 16 ? " l2" : n > 12 ? " l1" : "");
      if(!on && prev[i] !== undefined){
        void v.offsetWidth;
        v.classList.add("bump");
      }
      prev[i] = shown;
    }
  }
}

rowsEl.addEventListener("click", function(e){
  var t = e.target.closest("[data-sel],[data-pick],[data-del]");
  if(!t) return;
  if(t.hasAttribute("data-del")){
    if(list.length<=2) return;
    var d = +t.getAttribute("data-del");
    list.splice(d,1);
    if(active>=list.length) active = list.length-1;
    save(); render(); return;
  }
  if(t.hasAttribute("data-pick")){ openPicker(+t.getAttribute("data-pick")); return; }
  var i = +t.getAttribute("data-sel");
  if(i!==active){
    buzz(10);
    pushHistory();
    var v = evalExpr(expr);
    var nv = convert(v, list[active], list[i]);
    active = i;
    expr = (nv===null||nv===0) ? "" :
           String(Math.abs(nv) >= 10 ? Math.round(nv) : Math.round(nv*100)/100);
    freshBase = true;
    render();
  }
});

/* long press any row to copy its value */
var pressTimer = null;
rowsEl.addEventListener("touchstart", startPress, {passive:true});
rowsEl.addEventListener("mousedown", startPress);
["touchend","touchmove","touchcancel","mouseup","mouseleave"].forEach(function(ev){
  rowsEl.addEventListener(ev, function(){ clearTimeout(pressTimer); }, {passive:true});
});
function startPress(e){
  var t = e.target.closest("[data-sel]"); if(!t) return;
  var i = +t.getAttribute("data-sel");
  clearTimeout(pressTimer);
  pressTimer = setTimeout(function(){
    var val = i===active ? String(evalExpr(expr)) : String(convert(evalExpr(expr), list[active], list[i]));
    copy(val);
    buzz(24);
    toast(list[i] + " " + fmt(parseFloat(val)) + " copied");
  }, 550);
}
function copy(txt){
  try{
    if(navigator.clipboard) { navigator.clipboard.writeText(txt); return; }
  }catch(e){}
  var ta = document.createElement("textarea");
  ta.value = txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); }catch(e){}
  document.body.removeChild(ta);
}

/* ---------- keypad ---------- */
document.querySelector(".pad").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  buzz(8);
  press(b.getAttribute("data-k"));
});
function press(k){
  if(freshBase && (/^[0-9.]$/.test(k))){ expr = ""; }
  freshBase = false;
  if(k==="C"){ expr=""; }
  else if(k==="back"){ expr = expr.slice(0,-1); }
  else if(k==="="){ expr = String(evalExpr(expr)); pushHistory(); }
  else if(k==="%"){
    var m = expr.match(/(\d+\.?\d*)$/);
    if(m){ expr = expr.slice(0,m.index) + String(parseFloat(m[1])/100); }
  }
  else if("+-*/".indexOf(k)>=0){
    if(!expr) { if(k==="-") expr="-"; }
    else if("+-*/".indexOf(expr.slice(-1))>=0) expr = expr.slice(0,-1)+k;
    else expr += k;
  }
  else if(k==="."){
    var last = expr.split(/[+\-*/]/).pop();
    if(last.indexOf(".")<0) expr += (last===""?"0.":".");
  }
  else { if(expr==="0") expr=k; else expr += k; }
  render();
}
document.addEventListener("keydown", function(e){
  if(document.getElementById("search")===document.activeElement) return;
  var k = e.key;
  if(/^[0-9.]$/.test(k)) press(k);
  else if("+-*/".indexOf(k)>=0 && k.length===1) press(k);
  else if(k==="Enter"||k==="=") press("=");
  else if(k==="Backspace") press("back");
  else if(k==="Escape") press("C");
  else if(k==="%") press("%");
});

var regionNames = null;
try{ regionNames = new Intl.DisplayNames(["en"], {type:"region"}); }catch(e){}
var countryCache = {};
function countryOf(code){
  if(countryCache[code] !== undefined) return countryCache[code];
  var cc = cc2(code), n = "";
  if(cc && regionNames){ try{ n = regionNames.of(cc) || ""; }catch(e){ n = ""; } }
  countryCache[code] = n;
  return n;
}
function itemHTML(c){
  var used = list.indexOf(c)>=0;
  return '<div class="item'+(used?" sel":"")+'" data-c="'+c+'">'+flag(c)+
         '<span class="cd">'+c+'</span><span class="nm">'+nameOf(c)+
         (countryOf(c) ? ' <i>'+countryOf(c)+'</i>' : '')+'</span>'+
         '<span class="rt">'+fmt(rates[c])+'</span></div>';
}
function drawList(q){
  var codes = Object.keys(rates).sort(), html = "";
  if(!q && recents.length){
    html += '<div class="grp">Recent</div>';
    recents.forEach(function(c){ if(rates[c]) html += itemHTML(c); });
    html += '<div class="grp">All currencies</div>';
  }
  codes.forEach(function(c){
    if(q){
      var hay = (c + " " + nameOf(c) + " " + countryOf(c)).toLowerCase();
      if(hay.indexOf(q) < 0) return;
    }
    html += itemHTML(c);
  });
  listEl.innerHTML = html || '<div class="note">No match.</div>';
}
listEl.addEventListener("click", function(e){
  var it = e.target.closest("[data-c]"); if(!it) return;
  var c = it.getAttribute("data-c");
  pushRecent(c);
  if(pickTarget===null){ if(list.indexOf(c)<0) list.push(c); }
  else {
    var ex = list.indexOf(c);
    if(ex>=0 && ex!==pickTarget) return;
    list[pickTarget] = c;
  }
  save(); closePicker(); render();
});

/* ---------- rate table ---------- */
var rSheet = document.getElementById("ratesSheet");

/* 4 significant digits, no scientific notation */
function sig(v){
  if(!isFinite(v) || v === 0) return "0";
  var a = Math.abs(v), d;
  if(a >= 1000) d = 2; else if(a >= 100) d = 2; else if(a >= 1) d = 4;
  else d = Math.min(8, 3 - Math.floor(Math.log(a) / Math.LN10));
  return v.toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:d});
}
/* tiny inverse rates read better per 100 or per 1,000 units */
function inverseLine(from, to){
  var r = rates[to] / rates[from];           // 1 from = r to
  var mult = 1;
  if(r < 0.01) mult = 1000; else if(r < 0.1) mult = 100;
  return fmt(mult) .replace(".00","") + " " + from + " = " + sig(r * mult) + " " + to;
}
document.getElementById("btnRates").onclick = function(){
  var base = list[active], h = "";
  h += '<div class="grp">Base currency</div>';
  h += '<div class="ritem base">'+flag(base)+'<span class="rc">'+base+'</span>'+
       '<div class="rr"><div class="r1">'+nameOf(base)+'</div>'+
       '<div class="r2">every rate below is per 1 '+base+'</div></div></div>';
  h += '<div class="grp">Rates</div>';
  list.forEach(function(c){
    if(c===base) return;
    h += '<div class="ritem">'+flag(c)+'<span class="rc">'+c+'</span>'+
         '<div class="rr">'+
           '<div class="r1">1 '+base+' = <b>'+sig(rates[c]/rates[base])+'</b> '+c+'</div>'+
           '<div class="r2">'+inverseLine(c, base)+'</div>'+
         '</div></div>';
  });
  document.getElementById("rateList").innerHTML = h;
  document.getElementById("rateNote").textContent = "Rates updated " + rateDate + ". Mid-market, refreshed once every 24 hours. Banks and remittance services apply their own spread, so the cash you receive is usually lower.";
  rSheet.classList.add("on");
};

/* ---------- fetch ---------- */
var statusEl = document.getElementById("status"), refBtn = document.getElementById("btnRefresh");
function save(){
  ls("rb_list", JSON.stringify(list));
  ls("rb_rates", JSON.stringify({rates:rates,date:rateDate}));
}
function setStatus(txt, cls){ statusEl.textContent = txt; statusEl.className = cls||""; }
function tick(){ setStatus("Updated " + rateDate, live ? "" : "stale"); }

/* Fiat allowlist. The bundled table is the reference set, so crypto tickers and
   metals from the mirror endpoints (1INCH, AAVE, ADA, XAU...) never reach the UI. */
function fiatOnly(src){
  var out = {}, k;
  for(k in BUNDLED) out[k] = BUNDLED[k];          // keep the full fiat list
  for(k in src){                                   // overwrite with fresh values
    if(BUNDLED.hasOwnProperty(k) && typeof src[k] === "number" && src[k] > 0) out[k] = src[k];
  }
  return out;
}

/* Normalise the two supported payload shapes into {CODE: rateVsUSD} */
function parseRates(d){
  if(d && d.result === "success" && d.rates){
    return {rates: fiatOnly(d.rates), date: dateLabel(new Date(d.time_last_update_unix * 1000))};
  }
  if(d && d.usd){
    var out = {}, k;
    for(k in d.usd) out[k.toUpperCase()] = d.usd[k];
    out = fiatOnly(out);
    var parts = (d.date || "").split("-");
    var lbl = parts.length === 3
      ? label(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10))
      : BUNDLED_DATE;
    return {rates: out, date: lbl};
  }
  return null;
}

function load(force){
  refBtn.firstElementChild.classList.add("spin");
  var i = 0;
  function attempt(){
    if(i >= APIS.length){
      live = false; tick();
      refBtn.firstElementChild.classList.remove("spin");
      toast("Could not reach the rate server. Showing rates from " + rateDate + ".");
      return;
    }
    fetch(APIS[i++], {cache: force ? "reload" : "default"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var p = parseRates(d);
        if(!p || !p.rates.USD) throw new Error("shape");
        var changed = p.date !== rateDate;
        rates = p.rates; rateDate = p.date; live = true;
        save(); render(); tick();
        refBtn.firstElementChild.classList.remove("spin");
        if(force) toast(changed ? "Updated to " + rateDate : "Already the latest, " + rateDate);
      })
      .catch(attempt);
  }
  attempt();
}
refBtn.onclick = function(){ buzz(12); load(true); };

tick();
render();
load(false);

/* ---------- drag to reorder (edit mode) ---------- */
var drag = null;
function pointY(e){ return e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY; }
rowsEl.addEventListener("touchstart", gripDown, {passive:false});
rowsEl.addEventListener("mousedown", gripDown);
document.addEventListener("touchmove", gripMove, {passive:false});
document.addEventListener("mousemove", gripMove);
document.addEventListener("touchend", gripUp);
document.addEventListener("touchcancel", gripUp);
document.addEventListener("mouseup", gripUp);

function gripDown(e){
  var g = e.target.closest("[data-grip]"); if(!g) return;
  e.preventDefault();
  clearTimeout(pressTimer);
  var rows = Array.prototype.slice.call(rowsEl.children);
  var from = +g.getAttribute("data-grip");
  var cs = getComputedStyle(rowsEl);
  var gap = parseFloat(cs.rowGap || cs.gap) || 8;
  drag = {rows:rows, from:from, cur:from, y0:pointY(e), step:rows[from].offsetHeight + gap};
  rows.forEach(function(r){ r.style.animation = "none"; });
  rows[from].classList.add("dragging");
  rows[from].style.transform = "translateY(0px) scale(1.02)";
  rows.forEach(function(r,i){ if(i!==from) r.classList.add("shifting"); });
  document.body.classList.add("dragging");
  buzz(14);
}
function gripMove(e){
  if(!drag) return;
  e.preventDefault();
  var dy = pointY(e) - drag.y0;
  drag.rows[drag.from].style.transform = "translateY(" + dy + "px) scale(1.02)";
  var t = drag.from + Math.round(dy / drag.step);
  t = Math.max(0, Math.min(drag.rows.length - 1, t));
  if(t !== drag.cur){ drag.cur = t; buzz(6); }
  drag.rows.forEach(function(r, idx){
    if(idx === drag.from) return;
    var shift = 0;
    if(drag.from < drag.cur && idx > drag.from && idx <= drag.cur) shift = -drag.step;
    else if(drag.from > drag.cur && idx < drag.from && idx >= drag.cur) shift = drag.step;
    r.style.transform = "translateY(" + shift + "px)";
  });
}
function gripUp(){
  if(!drag) return;
  var from = drag.from, to = drag.cur, rows = drag.rows;
  drag = null;
  document.body.classList.remove("dragging");

  if(from === to){
    /* snap back smoothly */
    rows[from].classList.add("shifting");
    rows[from].style.transform = "";
    setTimeout(function(){ rows.forEach(clearRow); }, 170);
    return;
  }

  /* settle the dragged row into its new slot, then commit the order silently */
  rows[from].classList.add("shifting");
  rows[from].style.transform = "translateY(" + ((to - from) * (rows[from].offsetHeight + 8)) + "px) scale(1)";
  var activeCode = list[active];
  var moved = list.splice(from, 1)[0];
  list.splice(to, 0, moved);
  active = Math.max(0, list.indexOf(activeCode));
  save(); buzz(18);
  setTimeout(function(){
    rows.forEach(clearRow);
    built = ""; prev = [];
    render();
  }, 170);
}
function clearRow(r){
  r.style.transform = "";
  r.style.animation = "";
  r.classList.remove("dragging");
  r.classList.remove("shifting");
}

/* ---------- history ---------- */
var hSheet = document.getElementById("histSheet");
document.getElementById("histClose").onclick = function(){ hSheet.classList.remove("on"); };
hSheet.addEventListener("click", function(e){ if(e.target===hSheet) hSheet.classList.remove("on"); });
function timeLabel(ts){
  var d = new Date(ts), now = new Date();
  var hh = d.getHours(), mm = ("0"+d.getMinutes()).slice(-2);
  var ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
  var t = hh + ":" + mm + " " + ap;
  var sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return "Today " + t;
  var y = new Date(now.getTime() - 86400000);
  if(d.toDateString() === y.toDateString()) return "Yesterday " + t;
  return d.getDate() + " " + MONTHS[d.getMonth()] + ", " + t;
}
document.getElementById("btnHist").onclick = function(){
  pushHistory();

    }).join("");

  document.getElementById("histNote").textContent = history.length ? "Tap any line to load that amount back in." : "";
  hSheet.classList.add("on");
};
document.getElementById("histList").addEventListener("click", function(e){
  var it = e.target.closest("[data-h]"); if(!it) return;

  if(list.indexOf(h.c) < 0){ list.push(h.c); save(); built = ""; }
  active = list.indexOf(h.c);
  expr = String(Math.abs(h.a) >= 10 ? Math.round(h.a) : Math.round(h.a*100)/100);
  freshBase = true;
  hSheet.classList.remove("on");
  render(); buzz(12);
});
