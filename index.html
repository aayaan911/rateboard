<style>
:root{
  --bg:#0a0a0a; --row:#2b2b2b; --row2:#232323; --chip:#252525; --chip-b:#3a3a3a;
  --active:#3d3320; --active-b:#ffb020; --txt:#f2f2f2; --mut:#8a8a8a;
  --key:#2e2e2e; --key-l:#b8b8b8; --acc:#ffa000; --ok:#3ddc84;
  --rowh:clamp(28px,min(6.9vh,13vw),60px);
  --keyh:clamp(26px,min(6.4vh,13.5vw),58px);
  --gap:clamp(4px,min(1vh,2vw),9px);
  --pad-x:clamp(6px,2.4vw,14px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;height:100dvh}
body{
  background:var(--bg);color:var(--txt);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-feature-settings:'cv05' 1,'cv11' 1;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
.wrap{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100%;min-height:0}

header{
  display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto;
  padding:clamp(5px,1.3vh,12px) var(--pad-x) clamp(3px,.9vh,8px)
}
.brand{
  display:flex;align-items:center;gap:9px;min-width:0;flex:1 1 auto;overflow:hidden;
  text-decoration:none;color:inherit;cursor:pointer;
  transition:opacity .15s ease,transform .12s cubic-bezier(.3,1.4,.5,1);
  transform-origin:left center
}
.brand:active{transform:scale(.97);opacity:.75}
.brand .txt{min-width:0;overflow:hidden}
.mark{
  width:clamp(24px,min(8vw,4.2vh),34px);height:clamp(24px,min(8vw,4.2vh),34px);
  flex:0 0 auto;aspect-ratio:1;line-height:0
}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.brand h1{
  font-size:clamp(13px,min(4.7vw,2.6vh),21px);font-weight:700;letter-spacing:-.6px;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.brand h1 span{color:#fff}
.brand h1 b{color:var(--acc);font-weight:700}
.brand small{
  display:flex;align-items:center;gap:5px;font-size:clamp(9px,min(3vw,1.5vh),11.5px);color:#c9a24c;
  margin-top:2px;letter-spacing:.1px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden
}
.brand small #status{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.brand small::before{
  content:"";width:5px;height:5px;border-radius:50%;background:currentColor;
  flex:0 0 5px;box-shadow:0 0 6px currentColor;opacity:.9
}
.brand small.stale{color:#8d8d8d}
.brand small.stale::before{box-shadow:none;opacity:.6}
.brand small.err{color:#e06a6a}
.right{display:flex;align-items:center}

.tools{display:flex;gap:clamp(7px,2.6vw,11px);align-items:center;flex:0 0 auto}
.tools button{background:none;border:0;color:var(--acc);line-height:0;cursor:pointer;padding:3px}
.tools button svg{width:clamp(17px,min(5.6vw,2.8vh),22px);height:clamp(17px,min(5.6vw,2.8vh),22px);display:block}
.tools button:active{opacity:.5}
.spin{animation:sp .8s linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}

.rows{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:2px var(--pad-x) clamp(3px,.8vh,8px);
  display:flex;flex-direction:column;gap:var(--gap);
  scrollbar-width:none
}
.rows::-webkit-scrollbar{width:0;height:0}
.row{display:flex;gap:10px;align-items:stretch}
.cur{
  flex:0 0 clamp(74px,26vw,128px);background:var(--chip);border:1px solid var(--chip-b);
  border-radius:clamp(10px,2.4vh,16px);
  display:flex;align-items:center;gap:clamp(5px,1.8vw,9px);padding:0 clamp(6px,2.6vw,12px);cursor:pointer;
}
.cur .fl{
  width:clamp(18px,min(6.8vw,3.4vh),28px);height:clamp(18px,min(6.8vw,3.4vh),28px);
  border-radius:50%;flex:0 0 auto;aspect-ratio:1;object-fit:cover;background:transparent;display:block;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 1px 3px rgba(0,0,0,.55)
}
.cur .fle{font-size:clamp(15px,min(5.6vw,2.9vh),22px);line-height:1;flex:0 0 auto;text-align:center}
.cur .cd{font-size:clamp(11px,min(4.3vw,2.2vh),18px);font-weight:600;letter-spacing:.3px}
.amt{
  flex:1;background:var(--row);border:1px solid transparent;border-radius:clamp(10px,2.4vh,16px);
  padding:clamp(4px,1.1vh,10px) clamp(8px,3vw,14px);min-height:var(--rowh);
  display:flex;flex-direction:row;
  align-items:center;justify-content:space-between;gap:clamp(4px,1.6vw,8px);cursor:pointer;overflow:hidden;
}
.amt .sym{
  font-size:clamp(10px,min(3.6vw,1.9vh),15px);font-weight:600;color:#8f8f8f;flex:0 0 auto;
  min-width:16px;text-align:left;line-height:1
}
.amt .v{
  font-size:clamp(14px,min(5.6vw,3vh),26px);font-weight:400;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;text-align:right;flex:1;font-variant-numeric:tabular-nums;
  transition:font-size .12s ease,color .2s ease
}
.amt .v.l1{font-size:clamp(13px,min(4.9vw,2.6vh),23px)}
.amt .v.l2{font-size:clamp(12px,min(4.3vw,2.3vh),20px)}
.amt .v.l3{font-size:clamp(10px,min(3.7vw,2vh),17px)}
.row.on .amt{background:var(--active);border-color:var(--active-b)}
.row.on .amt .v{color:#ffd58a}
.row.on .amt .sym{color:#e0a94e}
.row .del{flex:0 0 clamp(24px,8vw,34px);display:none;align-items:center;justify-content:center;background:#3a2020;border:1px solid #5a2c2c;border-radius:12px;color:#ff7b7b;font-size:18px;cursor:pointer}
body.edit .row .del{display:flex}
.editbar{display:none;flex-direction:column;padding:0 var(--pad-x) clamp(4px,1vh,8px);flex:0 0 auto}
body.edit .editbar{display:flex;animation:rise .28s ease both}
.eb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eb-title{font-size:clamp(13px,min(4.2vw,2.1vh),16px);font-weight:700;letter-spacing:-.2px}
.eb-done{
  background:var(--acc);color:#1a1200;border:0;border-radius:999px;cursor:pointer;
  padding:clamp(5px,1vh,8px) clamp(14px,4.4vw,20px);font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;font-size:clamp(10px,min(3.2vw,1.6vh),12px);
  transition:transform .12s cubic-bezier(.3,1.5,.5,1),filter .15s ease
}
.eb-done:active{transform:scale(.93);filter:brightness(1.1)}
.eb-hint{
  color:#7d7d7d;font-size:clamp(9.5px,min(3vw,1.5vh),12px);line-height:1.5;
  margin:clamp(3px,.7vh,6px) 0 clamp(5px,1vh,9px)
}
.eb-cols{
  display:flex;justify-content:space-between;color:#5f5f5f;
  font-size:clamp(8px,min(2.6vw,1.3vh),10px);font-weight:700;letter-spacing:1px;
  text-transform:uppercase;padding:0 2px clamp(3px,.6vh,5px);border-bottom:1px solid #232323
}
.eb-cols span:last-child{margin-right:clamp(52px,17vw,70px)}
body.edit .rows{flex:0 1 auto}

.addbtn{
  margin:clamp(3px,.8vh,7px) var(--pad-x) 0;padding:clamp(7px,1.5vh,12px);
  border-radius:14px;border:1px dashed #4a4a4a;
  background:none;color:var(--acc);font-size:clamp(11px,min(3.8vw,1.9vh),15px);
  cursor:pointer;display:none;flex:0 0 auto;width:auto;
  transition:background .18s ease,border-color .18s ease,transform .12s ease
}
.addbtn:active{transform:scale(.98);background:#1d1a12;border-color:var(--acc)}
body.edit .addbtn{display:block}

.row .sp{display:none;align-items:center;gap:2px;flex:0 0 clamp(54px,18vw,74px);
  background:#1e1e1e;border:1px solid #383838;border-radius:12px;padding:0 8px;height:auto}
.row .sp input{
  width:100%;background:none;border:0;outline:none;color:var(--acc);font-size:14px;font-weight:600;
  text-align:right;font-family:inherit;-moz-appearance:textfield
}
.row .sp input::-webkit-outer-spin-button,.row .sp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.row .sp i{color:#7a7a7a;font-style:normal;font-size:12px;font-weight:600}
body.edit .row .sp{display:flex}
.amt .cut{
  font-size:10px;font-weight:600;color:#6fcf8b;background:#17251a;border:1px solid #2f5138;
  border-radius:6px;padding:2px 5px;margin-right:auto;margin-left:6px;letter-spacing:.3px
}

/* keypad ripple */
.pad button{position:relative;overflow:hidden}
.rip{
  position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);
  background:rgba(255,255,255,.28);pointer-events:none;animation:rip .45s ease-out forwards
}
.pad .lt .rip{background:rgba(0,0,0,.18)}
@keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}

.pad{
  display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:var(--keyh);gap:var(--gap);
  flex:0 0 auto;padding:clamp(3px,.8vh,6px) var(--pad-x) calc(clamp(4px,1vh,10px) + env(safe-area-inset-bottom))
}
.pad button{
  border:0;border-radius:clamp(12px,3vh,20px);background:var(--key);color:var(--txt);
  font-size:clamp(14px,min(5.6vw,3vh),25px);font-weight:500;height:100%;cursor:pointer;
  font-variant-numeric:tabular-nums;letter-spacing:.2px;
  display:flex;align-items:center;justify-content:center
}
.pad button:active{filter:brightness(1.5)}
.pad .lt{background:var(--key-l);color:#111;font-weight:600}
.pad .op{background:var(--acc);color:#fff;font-weight:600}
.pad .z{grid-column:span 2}
.pad .ic svg{
  width:clamp(15px,min(6.4vw,3.4vh),29px);height:clamp(15px,min(6.4vw,3.4vh),29px);display:block;
  fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round
}
.pad .lt.ic svg{stroke-width:2.4}

.sheet{
  position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;
  align-items:flex-end;justify-content:center;z-index:50
}
.sheet.on{display:flex}
.panel{
  background:#151515;width:100%;max-width:520px;max-height:82vh;border-radius:20px 20px 0 0;
  display:flex;flex-direction:column;overflow:hidden
}
.panel h2{font-size:16px;padding:16px;border-bottom:1px solid #262626;display:flex;justify-content:space-between;align-items:center}
.panel h2 span{color:var(--acc);cursor:pointer;font-size:22px;line-height:1}
.search{margin:12px 16px;padding:12px 14px;border-radius:12px;border:1px solid #333;background:#1e1e1e;color:var(--txt);font-size:16px;outline:none}
.list{overflow-y:auto;padding:0 8px 20px}
.item{display:flex;align-items:center;gap:12px;padding:13px 12px;border-radius:12px;cursor:pointer}
.item:active{background:#242424}
.item .fl{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 1px 3px rgba(0,0,0,.5)}
.item .fle{font-size:21px;width:26px;flex:0 0 26px;text-align:center}
.item .cd{font-weight:600;width:52px}
.item .nm{color:var(--mut);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .rt{color:#666;font-size:12px}
.item.sel{background:#232323}
.note{padding:0 18px 18px;color:var(--mut);font-size:12px;line-height:1.6}
.note .credit{
  display:block;color:#7e7e7e;font-size:11px;font-weight:700;letter-spacing:.6px;
  text-transform:uppercase;margin-bottom:7px
}

/* ---------- motion ---------- */
.row{animation:rise .34s cubic-bezier(.2,.8,.25,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.amt{transition:background .22s ease,border-color .22s ease,transform .12s ease}
.amt:active{transform:scale(.985)}
.cur{transition:transform .12s ease,background .2s ease}
.cur:active{transform:scale(.96)}
.row.on .amt{box-shadow:0 0 0 3px rgba(255,176,32,.10)}
.row.on .cur{background:#2f2a1e;border-color:#5a4a24}

.amt .v{transition:color .2s ease}
.bump{animation:bump .3s cubic-bezier(.2,.9,.3,1)}
@keyframes bump{0%{opacity:.35;transform:translateY(-5px)}60%{opacity:1;transform:translateY(1px)}100%{transform:none}}

.pad button{transition:transform .09s cubic-bezier(.3,1.4,.5,1),filter .09s ease}
.pad button:active{transform:scale(.9)}

.sheet{animation:fade .18s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet.on .panel{animation:slide .3s cubic-bezier(.2,.85,.25,1) both}
@keyframes slide{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

.toast{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,16px);
  background:#efefef;color:#111;font-size:13px;font-weight:500;padding:10px 16px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s ease,transform .25s cubic-bezier(.2,.9,.3,1);
  z-index:80;max-width:88vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.5)
}
.toast.on{opacity:1;transform:translate(-50%,0)}

.tools button svg{transition:transform .15s ease}
.tools button:active svg{transform:scale(.85)}
body.edit .row .del{animation:fade .2s ease backwards}

/* grip + drag */
/* always visible so reordering needs no mode switch */
.row .grip{
  flex:0 0 clamp(20px,7vw,30px);display:flex;align-items:center;justify-content:center;background:transparent;
  border:0;border-radius:10px;color:#565656;cursor:grab;touch-action:none;
  transition:color .15s ease,background .15s ease
}
.row .grip svg{width:19px;height:19px;fill:currentColor;pointer-events:none}
.row .grip:active{color:var(--acc);background:#2a2417}
body.edit .row .grip{background:#242424;border:1px solid #383838;color:#9a9a9a}
body.edit .amt{display:none}
body.edit .cur{flex:1 1 auto}
body.edit .cur::after{content:attr(data-name);color:#7d7d7d;font-size:12.5px;font-weight:400;margin-left:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{transition:transform .16s cubic-bezier(.2,.8,.25,1)}
.row.dragging{transition:none!important;animation:none!important;z-index:9;position:relative;will-change:transform}
.row.dragging .amt,.row.dragging .cur{box-shadow:0 12px 28px rgba(0,0,0,.6);border-color:var(--acc)}
.row.dragging .grip{color:var(--acc);background:#2f2a1e;cursor:grabbing}
.row.shifting{transition:transform .16s cubic-bezier(.2,.8,.25,1)}
.row.slot .amt{background:#242424}
body.dragging .rows{overflow:hidden}
body.dragging{user-select:none}

/* sheet extras */
.grp{padding:12px 12px 6px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#6f6f6f}
.item .nm i{color:#5f5f5f;font-style:normal}
.toast.tap{pointer-events:auto;cursor:pointer}
.toast .undo{color:#b06a00;margin-left:8px;text-transform:uppercase;font-size:11.5px;letter-spacing:.5px}
.hitem{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;cursor:pointer}
.hitem:active{background:#242424}
.hitem .ha{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.hitem .hc{color:var(--acc);font-size:13px;font-weight:600}
.hitem .ht{margin-left:auto;color:#666;font-size:11.5px;text-align:right;white-space:nowrap}
.empty{padding:26px 18px;text-align:center;color:#6f6f6f;font-size:13px;line-height:1.7}
.ritem{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px}
.ritem .fl{width:26px;height:26px;border-radius:50%;object-fit:cover;flex:0 0 26px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 1px 3px rgba(0,0,0,.5)}
.ritem .fle{font-size:21px;width:26px;flex:0 0 26px;text-align:center}
.ritem .rc{font-weight:700;width:50px;flex:0 0 50px;font-size:14px;letter-spacing:.3px}
.ritem .rr{flex:1;min-width:0}
.ritem .r1{font-size:14px;color:#e8e8e8;font-variant-numeric:tabular-nums}
.ritem .r1 b{font-weight:700;color:#fff}
.ritem .r2{font-size:11.5px;color:#7a7a7a;margin-top:2px;font-variant-numeric:tabular-nums}
.ritem.base{background:#221d12;border:1px solid #4a3c1c}
.ritem.base .rc{color:var(--acc)}
.ritem.base .r1{font-size:13px;color:#d9c79c}
.ritem.base .r2{color:#8a7a55}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

var symCache = {};
function symbolOf(code){
  if(symCache[code]) return symCache[code];
  var s = SYM[code] || code;
  if(!SYM[code]){
    try{
      var parts = new Intl.NumberFormat("en", {style:"currency", currency:code}).formatToParts(1);
      for(var i=0;i<parts.length;i++){
        if(parts[i].type === "currency" && parts[i].value !== code){ s = parts[i].value; break; }
      }
    }catch(e){}
  }
  symCache[code] = s;
  return s;
}

function cc2(code){ return FLAGX.hasOwnProperty(code) ? FLAGX[code] : code.slice(0,2); }

  var cc = cc2(code);

  return String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(0)-65)) + String.fromCodePoint(0x1F1E6 + (cc.charCodeAt(1)-65));

var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
/* "24 July". The year is appended only when it is not the current year. */
function label(day, monthIdx, year){
  var now = new Date().getFullYear();
  return day + " " + MONTHS_FULL[monthIdx] + (year && year !== now ? " " + year : "");
}
function dateLabel(d){
  if(!d || isNaN(d.getTime())) return BUNDLED_DATE;
  return label(d.getUTCDate(), d.getUTCMonth(), d.getUTCFullYear());
}

/* ---------- expression engine ---------- */
function evalExpr(s){
  if(!s) return 0;
  s = s.replace(/[+\-*/.]+$/,"");
  if(!s) return 0;
  var t = s.match(/(\d+\.?\d*|[+\-*/])/g);
  if(!t || !t.length) return 0;
  var a = [], i;
  for(i=0;i<t.length;i++){
    if(t[i]==="*"||t[i]==="/"){
      var l = parseFloat(a.pop()), r = parseFloat(t[++i]);
      if(isNaN(r)) r = 0;
      a.push(t[i-1]==="*" ? l*r : (r===0?0:l/r));
    } else a.push(t[i]);
  }
  var out = parseFloat(a[0])||0;
  for(i=1;i<a.length;i+=2){
    var n = parseFloat(a[i+1])||0;
    out = a[i]==="+" ? out+n : out-n;
  }
  return isFinite(out) ? out : 0;
}

function convert(v, from, to){
  if(!rates[from] || !rates[to]) return null;
  var out = v / rates[from] * rates[to];
  if(to !== from) out = out * (1 - spreadOf(to) / 100);
  return out;
}
/* Whole numbers by default. Decimals only appear when dropping them would
   destroy the value (small amounts and sub-unit rates). */
function fmt(v){
  if(v===null || !isFinite(v)) return "-";
  if(v===0) return "0";
  var a = Math.abs(v);
  if(a >= 10) return v.toLocaleString("en-US",{maximumFractionDigits:0});
  if(a >= 0.01) return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:6});
}

/* Rows are built once and then updated in place, so flags never re-flicker
   and each changed number can play its own micro animation. */
var rowsEl = document.getElementById("rows"), built = "", prev = [];
function buildRows(){
  rowsEl.innerHTML = list.map(function(code,i){
    return '<div class="row" data-i="'+i+'" style="animation-delay:'+(i*35)+'ms">'+
      '<div class="cur" data-pick="'+i+'" data-name="'+nameOf(code)+'">'+flag(code)+'<span class="cd">'+code+'</span></div>'+
      '<div class="amt" data-sel="'+i+'"><span class="sym">'+symbolOf(code)+'</span><div class="v"></div></div>'+
      '<label class="sp"><input type="number" inputmode="decimal" step="0.1" min="0" max="30" data-sp="'+code+'" value="'+(spreads[code]||0)+'"><i>%</i></label>'+
      '<div class="grip" data-grip="'+i+'" aria-label="Drag to reorder"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="1.5"/><circle cx="15" cy="7" r="1.5"/><circle cx="9" cy="12" r="1.5"/><circle cx="15" cy="12" r="1.5"/><circle cx="9" cy="17" r="1.5"/><circle cx="15" cy="17" r="1.5"/></svg></div>'+
      '<div class="del" data-del="'+i+'">&times;</div>'+
    '</div>';
  }).join("");
  built = list.join(",");
  prev = [];
  if(typeof scheduleFit === "function") scheduleFit();
}
/* group the digits of a plain typed number, leave expressions untouched */
function typed(){
  if(!expr) return "0";
  if(!/^-?\d*\.?\d*$/.test(expr)) return expr;
  var neg = expr.charAt(0) === "-", t = neg ? expr.slice(1) : expr;
  var dot = t.indexOf("."), ip = dot < 0 ? t : t.slice(0,dot), rest = dot < 0 ? "" : t.slice(dot);
  ip = ip.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return (neg ? "-" : "") + ip + rest;
}
function render(){
  if(built !== list.join(",")) buildRows();
  saveState();
  var base = list[active], val = evalExpr(expr);
  var rows = rowsEl.children;
  for(var i=0;i<rows.length;i++){
    var on = i===active;
    rows[i].classList.toggle("on", on);
    var v = rows[i].querySelector(".v");
    var shown = on ? typed() : fmt(convert(val, base, list[i]));

    var cut = rows[i].querySelector(".cut");
    var sp = on ? 0 : spreadOf(list[i]);
    if(sp > 0 && !cut){
      cut = document.createElement("span");
      cut.className = "cut";
      rows[i].querySelector(".amt").insertBefore(cut, v);
    }
    if(cut){
      if(sp > 0){ cut.textContent = "-" + sp + "%"; cut.style.display = ""; }
      else cut.style.display = "none";
    }

    if(prev[i] !== shown){
      v.textContent = shown;
      var n = shown.length;
      v.className = "v" + (n > 20 ? " l3" : n > 16 ? " l2" : n > 12 ? " l1" : "");
      if(!on){
        void v.offsetWidth;
        v.classList.add("bump");
      }
      prev[i] = shown;
    }
  }
}

rowsEl.addEventListener("click", function(e){

  if(!t) return;

    if(list.length <= 2){ toast("Keep at least two currencies"); return; }
    var d = +t.getAttribute("data-del");
    var removed = list[d], wasActive = list[active];
    list.splice(d, 1);
    active = Math.max(0, list.indexOf(wasActive));
    save(); built = ""; render(); buzz(14);
    toast(removed + " removed", "Undo", function(){
      list.splice(d, 0, removed);
      active = Math.max(0, list.indexOf(wasActive));
      save(); built = ""; render(); buzz(12);
    });
    return;
  }
  if(t.hasAttribute("data-pick")){ openPicker(+t.getAttribute("data-pick")); return; }
  var i = +t.getAttribute("data-sel");
  if(i!==active){
    buzz(10);
    pushHistory();
    var v = evalExpr(expr);
    var nv = convert(v, list[active], list[i]);
    active = i;
    expr = (nv===null||nv===0) ? "" :
           String(Math.abs(nv) >= 10 ? Math.round(nv) : Math.round(nv*100)/100);
    freshBase = true;
    render();
  }
});

function press(k){
  if(freshBase && (/^[0-9.]$/.test(k))){ expr = ""; }
  freshBase = false;
  if(k==="C"){ expr=""; freshBase=false; prev=[]; buzz(18); }
  else if(k==="back"){ expr = expr.slice(0,-1); }
  else if(k==="="){ expr = String(evalExpr(expr)); pushHistory(); }
  else if(k==="%"){
    var m = expr.match(/(\d+\.?\d*)$/);
    if(m){ expr = expr.slice(0,m.index) + String(parseFloat(m[1])/100); }
  }
  else if("+-*/".indexOf(k)>=0){
    if(!expr) { if(k==="-") expr="-"; }
    else if("+-*/".indexOf(expr.slice(-1))>=0) expr = expr.slice(0,-1)+k;
    else expr += k;
  }
  else if(k==="."){
    var last = expr.split(/[+\-*/]/).pop();
    if(last.indexOf(".")<0) expr += (last===""?"0.":".");
  }
  else { if(expr==="0") expr=k; else expr += k; }
  render();
}
document.addEventListener("keydown", function(e){

  var k = e.key;
  if(/^[0-9.]$/.test(k)) press(k);
  else if("+-*/".indexOf(k)>=0 && k.length===1) press(k);
  else if(k==="Enter"||k==="=") press("=");
  else if(k==="Backspace") press("back");
  else if(k==="Escape") press("C");
  else if(k==="%") press("%");
});

/* 4 significant digits, no scientific notation */
function sig(v){
  if(!isFinite(v) || v === 0) return "0";
  var a = Math.abs(v), d;
  if(a >= 1000) d = 2; else if(a >= 100) d = 2; else if(a >= 1) d = 4;
  else d = Math.min(8, 3 - Math.floor(Math.log(a) / Math.LN10));
  return v.toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:d});
}
/* tiny inverse rates read better per 100 or per 1,000 units */
function inverseLine(from, to){
  var r = rates[to] / rates[from];           // 1 from = r to
  var mult = 1;
  if(r < 0.01) mult = 1000; else if(r < 0.1) mult = 100;
  return fmt(mult) .replace(".00","") + " " + from + " = " + sig(r * mult) + " " + to;
}

/* Fiat allowlist. The bundled table is the reference set, so crypto tickers and
   metals from the mirror endpoints (1INCH, AAVE, ADA, XAU...) never reach the UI. */
function fiatOnly(src){
  var out = {}, k;
  for(k in BUNDLED) out[k] = BUNDLED[k];          // keep the full fiat list
  for(k in src){                                   // overwrite with fresh values
    if(BUNDLED.hasOwnProperty(k) && typeof src[k] === "number" && src[k] > 0) out[k] = src[k];
  }
  return out;
}

/* Normalise the two supported payload shapes into {CODE: rateVsUSD} */
function parseRates(d){
  if(d && d.result === "success" && d.rates){
    return {rates: fiatOnly(d.rates), date: dateLabel(new Date(d.time_last_update_unix * 1000))};
  }
  if(d && d.usd){
    var out = {}, k;
    for(k in d.usd) out[k.toUpperCase()] = d.usd[k];
    out = fiatOnly(out);
    var parts = (d.date || "").split("-");
    var lbl = parts.length === 3
      ? label(parseInt(parts[2],10), parseInt(parts[1],10)-1, parseInt(parts[0],10))
      : BUNDLED_DATE;
    return {rates: out, date: lbl};
  }
  return null;
}

function load(force){
  refBtn.firstElementChild.classList.add("spin");
  var i = 0;
  function attempt(){
    if(i >= APIS.length){
      live = false; tick();
      refBtn.firstElementChild.classList.remove("spin");
      toast("Could not reach the rate server. Showing rates from " + rateDate + ".");
      return;
    }
    fetch(APIS[i++], {cache: force ? "reload" : "default"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var p = parseRates(d);
        if(!p || !p.rates.USD) throw new Error("shape");
        var changed = p.date !== rateDate;
        rates = p.rates; rateDate = p.date; live = true;
        save(); render(); tick();
        refBtn.firstElementChild.classList.remove("spin");
        if(force) toast(changed ? "Updated to " + rateDate : "Already the latest, " + rateDate);
      })
      .catch(attempt);
  }
  attempt();
}
refBtn.onclick = function(){ buzz(12); load(true); };

tick();
render();
load(false);

/* ---------- drag to reorder (edit mode) ---------- */
var drag = null;
function pointY(e){ return e.touches && e.touches[0] ? e.touches[0].clientY : e.clientY; }
rowsEl.addEventListener("touchstart", gripDown, {passive:false});
rowsEl.addEventListener("mousedown", gripDown);
document.addEventListener("touchmove", gripMove, {passive:false});
document.addEventListener("mousemove", gripMove);
document.addEventListener("touchend", gripUp);
document.addEventListener("touchcancel", gripUp);
document.addEventListener("mouseup", gripUp);

function gripDown(e){
  var g = e.target.closest("[data-grip]"); if(!g) return;
  e.preventDefault();
  clearTimeout(pressTimer);
  var rows = Array.prototype.slice.call(rowsEl.children);
  var from = +g.getAttribute("data-grip");
  var cs = getComputedStyle(rowsEl);
  var gap = parseFloat(cs.rowGap || cs.gap) || 8;
  drag = {rows:rows, from:from, cur:from, y0:pointY(e), step:rows[from].offsetHeight + gap};
  rows.forEach(function(r){ r.style.animation = "none"; });
  rows[from].classList.add("dragging");
  rows[from].style.transform = "translateY(0px) scale(1.02)";
  rows.forEach(function(r,i){ if(i!==from) r.classList.add("shifting"); });
  document.body.classList.add("dragging");
  buzz(14);
}
function gripMove(e){
  if(!drag) return;
  e.preventDefault();
  var dy = pointY(e) - drag.y0;
  drag.rows[drag.from].style.transform = "translateY(" + dy + "px) scale(1.02)";
  var t = drag.from + Math.round(dy / drag.step);
  t = Math.max(0, Math.min(drag.rows.length - 1, t));
  if(t !== drag.cur){ drag.cur = t; buzz(6); }
  drag.rows.forEach(function(r, idx){
    if(idx === drag.from) return;
    var shift = 0;
    if(drag.from < drag.cur && idx > drag.from && idx <= drag.cur) shift = -drag.step;
    else if(drag.from > drag.cur && idx < drag.from && idx >= drag.cur) shift = drag.step;
    r.style.transform = "translateY(" + shift + "px)";
  });
}
function gripUp(){
  if(!drag) return;
  var from = drag.from, to = drag.cur, rows = drag.rows;
  drag = null;
  document.body.classList.remove("dragging");

  if(from === to){
    /* snap back smoothly */
    rows[from].classList.add("shifting");
    rows[from].style.transform = "";
    setTimeout(function(){ rows.forEach(clearRow); }, 170);
    return;
  }

  /* settle the dragged row into its new slot, then commit the order silently */
  rows[from].classList.add("shifting");
  rows[from].style.transform = "translateY(" + ((to - from) * (rows[from].offsetHeight + 8)) + "px) scale(1)";
  var activeCode = list[active];
  var moved = list.splice(from, 1)[0];
  list.splice(to, 0, moved);
  active = Math.max(0, list.indexOf(activeCode));
  save(); buzz(18);
  setTimeout(function(){
    rows.forEach(clearRow);
    built = ""; prev = [];
    render();
  }, 170);
}
function clearRow(r){
  r.style.transform = "";
  r.style.animation = "";
  r.classList.remove("dragging");
  r.classList.remove("shifting");
}

/* ---------- history ---------- */
var hSheet = document.getElementById("histSheet");
document.getElementById("histClose").onclick = function(){ hSheet.classList.remove("on"); };
hSheet.addEventListener("click", function(e){ if(e.target===hSheet) hSheet.classList.remove("on"); });
function creditLine(){ return '<b class="credit">RateBoard, developed by Ayaan Shohan</b>'; }
function timeLabel(ts){
  var d = new Date(ts), now = new Date();
  var hh = d.getHours(), mm = ("0"+d.getMinutes()).slice(-2);
  var ap = hh >= 12 ? "PM" : "AM"; hh = hh % 12 || 12;
  var t = hh + ":" + mm + " " + ap;
  var sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return "Today " + t;
  var y = new Date(now.getTime() - 86400000);
  if(d.toDateString() === y.toDateString()) return "Yesterday " + t;
  return d.getDate() + " " + MONTHS[d.getMonth()] + ", " + t;
}
document.getElementById("btnHist").onclick = function(){
  pushHistory();
  var h = document.getElementById("histList");
  if(!history.length){
    h.innerHTML = '<div class="empty">No conversions yet.<br>Type an amount and press = to save it here.</div>';
  } else {
    h.innerHTML = history.map(function(e,i){
      return '<div class="hitem" data-h="'+i+'"><span class="ha">'+fmt(e.a)+'</span>'+
             '<span class="hc">'+e.c+'</span>'+
             '<span class="ht">'+timeLabel(e.t)+'<br>rates '+(e.d||rateDate)+'</span></div>';
    }).join("");
  }
  document.getElementById("histNote").innerHTML = creditLine() +
    (history.length ? "Tap any line to load that amount back in." : "Conversions are saved here when you press equals or switch base currency.");
  hSheet.classList.add("on");
};
document.getElementById("histList").addEventListener("click", function(e){
  var it = e.target.closest("[data-h]"); if(!it) return;
  var h = history[+it.getAttribute("data-h")];
  if(!h) return;
  if(list.indexOf(h.c) < 0){ list.push(h.c); save(); built = ""; }
  active = list.indexOf(h.c);
  expr = String(Math.abs(h.a) >= 10 ? Math.round(h.a) : Math.round(h.a*100)/100);
  freshBase = true;
  hSheet.classList.remove("on");
  render(); buzz(12);
});

/* ---------- auto-fit: rows always divide whatever height is left ----------
   CSS clamps get most of the way there. This closes the last few pixels at any
   zoom level or window size, so a scrollbar only ever appears when the list is
   genuinely longer than the screen can show at the minimum readable size. */
function fitRows(){
  var n = list.length; if(!n) return;
  var cs = getComputedStyle(rowsEl);
  var gap = parseFloat(cs.rowGap || cs.gap) || 8;
  var padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
  var avail = rowsEl.clientHeight - padV;
  if(avail <= 0) return;
  var ideal = Math.floor((avail - (n - 1) * gap) / n);
  var h = Math.max(26, Math.min(60, ideal));
  document.documentElement.style.setProperty("--rowh", h + "px");
}
var fitT = null;
function scheduleFit(){ clearTimeout(fitT); fitT = setTimeout(function(){ fitRows(); fitRows(); }, 30); }
window.addEventListener("resize", scheduleFit);
window.addEventListener("orientationchange", scheduleFit);
if(window.visualViewport) window.visualViewport.addEventListener("resize", scheduleFit);
scheduleFit();

/* Register, then reload once when a newer worker takes over, so a deploy
   reaches the screen without the user clearing anything. */
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){
  var reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(reloading) return;
    reloading = true;
    location.reload();
  });
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.update();
    setInterval(function(){ reg.update(); }, 60 * 60 * 1000);
    reg.addEventListener("updatefound", function(){
      var nw = reg.installing;
      if(!nw) return;
      nw.addEventListener("statechange", function(){
        if(nw.state === "installed" && navigator.serviceWorker.controller){
          nw.postMessage("skip-waiting");
        }
      });
    });
  }).catch(function(){});
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && navigator.serviceWorker.ready){
      navigator.serviceWorker.ready.then(function(reg){ reg.update(); });
    }
  });
}
})();
